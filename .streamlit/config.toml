[theme]
base = "light"
primaryColor = "#346FB0"
backgroundColor = "#F6F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0E2747"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
enableXsrfProtection = true
# Sirve ./static en /app/static/ (manifiesto e íconos PWA)
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
