[theme]
base = "light"
primaryColor = "#2E5772"
backgroundColor = "#DCE7E1"
secondaryBackgroundColor = "#E6EBE1"
textColor = "#142033"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
enableXsrfProtection = true
# Sirve ./static en /app/static/ (manifiesto e íconos PWA)
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
