[theme]
base = "light"
primaryColor = "#0B5CAD"
backgroundColor = "#F2F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0B1F3A"
font = "sans serif"

[server]
headless = true
maxUploadSize = 10
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
